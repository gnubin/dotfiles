set -g default-terminal 'screen-256color' # Установка 256 цветовой темы
set -g prefix C-a                         # Назначение основного префикса на CTRL+a
bind s choose-tree -sZ -O name            # Сортировка сессий по имени
set-option -g history-limit 10000      

# Изменение индексов окон
set -g base-index 1 
setw -g pane-base-index 1

# Переназначение клавиш
unbind %                                  # Разбиндить %
bind | split-window -h                    # Вертикальное разделение окна на |

unbind '"'                                # Разбиндить %
bind - split-window -v                    # Горизонтальное разделение окна

unbind r                                  # Разбиндить r
bind r source-file ~/.tmux.conf           # Применене конфигурационного файла ~/.tmux.conf

# Нащначение клавишам j k l h на изменение размера разделения
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set -g mouse on                          # Включение поддержки мыши


# Копирование в термиале как в vim
#set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind-key -T copy-mode-vi 'y' send -X copy-selection 
unbind -T copy-mode-vi MouseDragEnd1Pane

# Список плагинов
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' 
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' 
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'

set -g @plugin 'tmux-plugins/tmux-yank'

set -g @themepack 'powerline/default/blue'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Запуск менеджера плагинов
run '~/.tmux/plugins/tpm/tpm'
